<!doctype html>
<html lang="en">

        <meta name="theme-color" content="#323d47" />

        <!-- Open Graph tags -->
        <meta property="og:site_name" content="nilllzz' blog" />

        <meta property="og:title" content="{{ TITLE }}" />
        <meta property="og:description" content="Read the article now on nilllzz.dev :3" />

        <link rel="stylesheet" href="/blog/style.css" />

        <title>{{ TITLE }} — nilllzz.dev</title>

    <body>
        <div class="layout-wrapper">

                            <div class="bgcolor-brand-3"></div>
                        </div>
